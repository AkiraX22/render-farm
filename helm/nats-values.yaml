config:
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 1Gi
  monitor:
    enabled: true

# KEDA's nats-jetstream scaler reads /jsz through the service.
service:
  ports:
    monitor:
      enabled: true

natsBox:
  enabled: true

promExporter:
  enabled: true
  podMonitor:
    enabled: true
