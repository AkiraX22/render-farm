# Development credentials, shared by MinIO and the render namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: minio
stringData:
  MINIO_ROOT_USER: render
  MINIO_ROOT_PASSWORD: render-farm-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: render
stringData:
  MINIO_ROOT_USER: render
  MINIO_ROOT_PASSWORD: render-farm-secret
