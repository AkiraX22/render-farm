apiVersion: batch/v1
kind: Job
metadata:
  name: render-setup
  namespace: render
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: render-controller:0.2.0
          imagePullPolicy: IfNotPresent
          args: ["setup"]
