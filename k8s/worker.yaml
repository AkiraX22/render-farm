apiVersion: v1
kind: Namespace
metadata:
  name: render
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-worker
  namespace: render
spec:
  selector:
    matchLabels:
      app: render-worker
  template:
    metadata:
      labels:
        app: render-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: worker
          image: render-worker:0.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats.nats.svc.cluster.local:4222
            - name: MINIO_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
          envFrom:
            - secretRef:
                name: minio-credentials
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi