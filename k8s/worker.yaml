apiVersion: v1
kind: Namespace
metadata:
  name: render
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-worker
  namespace: render
spec:
  replicas: 2
  selector:
    matchLabels:
      app: render-worker
  template:
    metadata:
      labels:
        app: render-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: worker
          image: render-worker:0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi