apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: render-worker
  namespace: render
spec:
  selector:
    matchLabels:
      app: render-worker
  podMetricsEndpoints:
    - port: metrics
      interval: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio
  namespace: minio
spec:
  selector:
    matchLabels:
      app: minio
  endpoints:
    - port: api
      path: /minio/v2/metrics/cluster
      interval: 15s
